name: Xcode App Store Archive

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: Upload the exported IPA to App Store Connect
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROJECT_PATH: PosturePilotAI.xcodeproj
  SCHEME: PosturePilotAI
  CONFIGURATION: Release
  BUNDLE_ID: com.posturepilotai.app
  MARKETING_VERSION: "1.0"

jobs:
  app-store-archive:
    name: Signed iOS Archive
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Scan for committed API secrets
        run: python3 Scripts/scan_secrets.py

      - name: Validate App Store metadata
        run: python3 Scripts/validate_app_store_metadata.py

      - name: Verify signing configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_MATERIAL: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=()
          [[ -z "$APPLE_TEAM_ID" ]] && missing+=("APPLE_TEAM_ID")
          [[ -z "$APP_STORE_CONNECT_API_KEY_ID" ]] && missing+=("APP_STORE_CONNECT_API_KEY_ID")
          [[ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ]] && missing+=("APP_STORE_CONNECT_API_ISSUER_ID or APP_STORE_CONNECT_ISSUER_ID")
          [[ -z "$APP_STORE_CONNECT_API_KEY_MATERIAL" ]] && missing+=("APP_STORE_CONNECT_API_KEY_BASE64 or APP_STORE_CONNECT_API_PRIVATE_KEY")
          [[ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]] && missing+=("IOS_DISTRIBUTION_CERTIFICATE_BASE64")
          [[ -z "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] && missing+=("IOS_DISTRIBUTION_CERTIFICATE_PASSWORD")
          [[ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]] && missing+=("IOS_PROVISIONING_PROFILE_BASE64")

          if (( ${#missing[@]} )); then
            printf "::error::Missing required GitHub Actions secrets: %s\n" "${missing[*]}"
            exit 1
          fi

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_MATERIAL: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          ASC_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$ASC_KEY_DIR"

          python3 - "$ASC_KEY_PATH" <<'PY'
          import base64
          import os
          import sys

          material = os.environ["APP_STORE_CONNECT_API_KEY_MATERIAL"].strip()
          if "BEGIN PRIVATE KEY" in material:
              key_data = material.replace("\\n", "\n").encode("utf-8")
          else:
              key_data = base64.b64decode(material)

          output_path = sys.argv[1]
          with open(output_path, "wb") as key_file:
              key_file.write(key_data)
          PY

          grep -q "BEGIN PRIVATE KEY" "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

          {
            echo "ASC_KEY_PATH=$ASC_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Install signing certificate and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          decode_secret() {
            local value="$1"
            local output="$2"
            printf "%s" "$value" | base64 --decode > "$output" 2>/dev/null || \
            printf "%s" "$value" | base64 -D > "$output"
          }

          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/PosturePilotAI_AppStore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/PosturePilotAI_AppStore.plist"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/posturepilot-signing.keychain-db"

          decode_secret "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" "$CERTIFICATE_PATH"
          decode_secret "$IOS_PROVISIONING_PROFILE_BASE64" "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          SIGNING_IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*Distribution.*\)".*/\1/p' | head -n 1)"

          if [[ -z "$SIGNING_IDENTITY_NAME" ]]; then
            echo "::error::No Apple/iPhone Distribution signing identity was found after importing the certificate."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID="${PROFILE_APP_IDENTIFIER#*.}"

          if [[ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ]]; then
            echo "::error::Provisioning profile bundle ID '$PROFILE_BUNDLE_ID' does not match '$BUNDLE_ID'."
            exit 1
          fi

          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
            echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "SIGNING_IDENTITY_NAME=$SIGNING_IDENTITY_NAME"
          } >> "$GITHUB_ENV"

      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/PosturePilotAI.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH" \
            clean archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_PATH"

          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PosturePilotAI.xcarchive" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"; then
            /usr/libexec/PlistBuddy -c "Set :method app-store" "$EXPORT_OPTIONS"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/PosturePilotAI.xcarchive" \
              -exportPath "$EXPORT_PATH" \
              -exportOptionsPlist "$EXPORT_OPTIONS"
          fi

          IPA_PATH="$(find "$EXPORT_PATH" -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::No IPA was exported."
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosturePilotAI-AppStore-IPA
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_app_store_connect }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Clean App Store Connect API key
        if: ${{ always() }}
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" && -f "$ASC_KEY_PATH" ]]; then
            rm -f "$ASC_KEY_PATH"
          fi
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "$SIGNING_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
